<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 620" width="320" height="620" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">
  <!-- Device Frame (Homescreen representation) -->
  <rect x="5" y="5" width="310" height="610" rx="30" fill="#f5f6f8" stroke="#2b2b2b" stroke-width="3"/>
  <rect x="110" y="12" width="100" height="16" rx="8" fill="#e0e0e0"/>

  <!-- Screen Header -->
  <text x="160" y="52" font-size="16" font-weight="bold" text-anchor="middle" fill="#111111">Widgets (Homescreen Glance)</text>
  <line x1="20" y1="65" x2="300" y2="65" stroke="#cccccc" stroke-width="1"/>

  <text x="160" y="88" font-size="11" text-anchor="middle" fill="#666666">Mobile Lockscreen / Homescreen Quick Cards</text>

  <!-- Large 2x2 Widget Mockup -->
  <g transform="translate(25, 110)">
    <rect x="0" y="0" width="270" height="130" rx="16" fill="#ffffff" stroke="#333333" stroke-width="2"/>
    <text x="18" y="26" font-size="11" font-weight="bold" fill="#777777">RESILIENCE NAVIGATOR WIDGET</text>

    <!-- Money Left Box -->
    <rect x="15" y="40" width="115" height="70" rx="10" fill="#f4f4f4" stroke="#333333" stroke-width="1"/>
    <text x="72" y="62" font-size="10" text-anchor="middle" fill="#666666">Money Left</text>
    <text x="72" y="85" font-size="16" font-weight="bold" text-anchor="middle" fill="#111111">RM 450</text>
    <text x="72" y="98" font-size="8" text-anchor="middle" fill="#555555">Safe: RM 15 / day</text>

    <!-- Reminder Box -->
    <rect x="140" y="40" width="115" height="70" rx="10" fill="#f8f9fa" stroke="#333333" stroke-width="1" stroke-dasharray="3 2"/>
    <text x="197" y="62" font-size="10" font-weight="bold" text-anchor="middle" fill="#111111">Reminder</text>
    <text x="197" y="80" font-size="9" text-anchor="middle" fill="#333333">SPayLater Due</text>
    <text x="197" y="94" font-size="8" text-anchor="middle" fill="#777777">24 Nov (RM 65)</text>
  </g>

  <!-- Lockscreen Compact Pill Widget -->
  <g transform="translate(25, 260)">
    <rect x="0" y="0" width="270" height="50" rx="25" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
    <text x="25" y="30" font-size="11" font-weight="bold" fill="#111111">⏱️ Balance: RM 450</text>
    <text x="245" y="30" font-size="10" text-anchor="end" fill="#555555">1 Bill Due This Week &gt;</text>
  </g>

  <!-- Explanatory Annotation Box -->
  <g transform="translate(25, 330)">
    <rect x="0" y="0" width="270" height="200" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1" stroke-dasharray="4 2"/>
    <text x="135" y="25" font-size="12" font-weight="bold" text-anchor="middle" fill="#111111">HCI &amp; Usability Rationale</text>
    <line x1="15" y1="35" x2="255" y2="35" stroke="#e0e0e0" stroke-width="1"/>

    <text x="15" y="55" font-size="10" font-weight="600" fill="#222222">1. Micro-Friction at Point of Sale:</text>
    <text x="15" y="70" font-size="9" fill="#555555">Displays current daily safe spending without</text>
    <text x="15" y="84" font-size="9" fill="#555555">forcing student to open banking/e-wallet apps.</text>

    <text x="15" y="108" font-size="10" font-weight="600" fill="#222222">2. BNPL Default Prevention:</text>
    <text x="15" y="123" font-size="9" fill="#555555">Surfaces upcoming installment deadlines directly</text>
    <text x="15" y="137" font-size="9" fill="#555555">on homescreen to avoid late fee penalties.</text>

    <text x="15" y="161" font-size="10" font-weight="600" fill="#222222">3. Zero-Click Ambient Awareness:</text>
    <text x="15" y="176" font-size="9" fill="#555555">Reinforces financial self-regulation through</text>
    <text x="15" y="190" font-size="9" fill="#555555">passive ambient visual nudges.</text>
  </g>

  <!-- Navigation Bar -->
  <g transform="translate(5, 550)">
    <rect x="0" y="0" width="310" height="55" rx="0" fill="#ffffff" stroke="#2b2b2b" stroke-width="2"/>
    <text x="38" y="28" font-size="10" text-anchor="middle" fill="#777777">Gauge</text>
    <text x="100" y="28" font-size="10" text-anchor="middle" fill="#777777">Tracker</text>
    <text x="165" y="28" font-size="10" text-anchor="middle" fill="#777777">BNPL</text>
    <text x="230" y="28" font-size="10" text-anchor="middle" fill="#777777">Events</text>
    <text x="285" y="28" font-size="9" font-weight="bold" text-anchor="middle" fill="#111111">[Widget]</text>
  </g>
</svg>
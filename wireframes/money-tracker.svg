<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 620" width="320" height="620" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">
  <!-- Device Frame -->
  <rect x="5" y="5" width="310" height="610" rx="30" fill="#ffffff" stroke="#2b2b2b" stroke-width="3"/>
  <rect x="110" y="12" width="100" height="16" rx="8" fill="#e0e0e0"/>

  <!-- Screen Header -->
  <text x="160" y="52" font-size="16" font-weight="bold" text-anchor="middle" fill="#111111">Money Tracker</text>
  <line x1="20" y1="65" x2="300" y2="65" stroke="#cccccc" stroke-width="1"/>

  <!-- Money Left vs Money Spent Top Summary -->
  <g transform="translate(25, 75)">
    <rect x="0" y="0" width="125" height="55" rx="6" fill="#f4f4f4" stroke="#333333" stroke-width="1.5"/>
    <text x="62" y="22" font-size="11" text-anchor="middle" fill="#666666">Money Left</text>
    <text x="62" y="42" font-size="15" font-weight="bold" text-anchor="middle" fill="#111111">RM 450.00</text>

    <rect x="145" y="0" width="125" height="55" rx="6" fill="#f4f4f4" stroke="#333333" stroke-width="1.5"/>
    <text x="207" y="22" font-size="11" text-anchor="middle" fill="#666666">Money Spent</text>
    <text x="207" y="42" font-size="15" font-weight="bold" text-anchor="middle" fill="#111111">RM 750.00</text>
  </g>

  <!-- Spending Categories (Progress Bar Style) -->
  <g transform="translate(25, 145)">
    <rect x="0" y="0" width="270" height="65" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
    <text x="15" y="20" font-size="12" font-weight="bold" fill="#111111">Spending categories (Progress Bar style)</text>
    <rect x="15" y="32" width="240" height="14" rx="4" fill="#e5e7eb"/>
    <rect x="15" y="32" width="120" height="14" rx="4" fill="#333333"/>
    <rect x="135" y="32" width="60" height="14" rx="0" fill="#777777"/>
    <rect x="195" y="32" width="40" height="14" rx="0" fill="#aaaaaa"/>
    <text x="15" y="57" font-size="9" fill="#555555">■ Food (50%)  ■ Transport (25%)  ■ Academic (17%)</text>
  </g>

  <!-- Calculations Area -->
  <g transform="translate(25, 222)">
    <rect x="0" y="0" width="270" height="135" rx="6" fill="#fbfbfb" stroke="#333333" stroke-width="1.5"/>
    <text x="135" y="24" font-size="13" font-weight="bold" text-anchor="middle" fill="#111111">Calculations</text>
    <line x1="15" y1="34" x2="255" y2="34" stroke="#e0e0e0" stroke-width="1"/>
    
    <text x="15" y="56" font-size="11" fill="#444444">Initial Semester Budget:</text>
    <text x="255" y="56" font-size="11" font-weight="600" text-anchor="end" fill="#111111">RM 1,200.00</text>

    <text x="15" y="78" font-size="11" fill="#444444">Total Logged Expenses:</text>
    <text x="255" y="78" font-size="11" font-weight="600" text-anchor="end" fill="#111111">- RM 750.00</text>

    <text x="15" y="100" font-size="11" fill="#444444">Pending BNPL Deductions:</text>
    <text x="255" y="100" font-size="11" font-weight="600" text-anchor="end" fill="#111111">- RM 170.00</text>

    <line x1="15" y1="110" x2="255" y2="110" stroke="#333333" stroke-width="1" stroke-dasharray="2 2"/>
    <text x="15" y="125" font-size="11" font-weight="bold" fill="#111111">Net Available Buffer:</text>
    <text x="255" y="125" font-size="12" font-weight="bold" text-anchor="end" fill="#111111">RM 280.00</text>
  </g>

  <!-- Categories Selection -->
  <g transform="translate(25, 370)">
    <rect x="0" y="0" width="270" height="95" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
    <text x="135" y="24" font-size="13" font-weight="bold" text-anchor="middle" fill="#111111">Categories Selection</text>
    
    <!-- Category Chips -->
    <rect x="15" y="35" width="70" height="24" rx="12" fill="#333333"/>
    <text x="50" y="51" font-size="10" font-weight="bold" text-anchor="middle" fill="#ffffff">🍽️ Food</text>

    <rect x="95" y="35" width="80" height="24" rx="12" fill="#f0f0f0" stroke="#333333" stroke-width="1"/>
    <text x="135" y="51" font-size="10" text-anchor="middle" fill="#111111">🚗 Travel</text>

    <rect x="185" y="35" width="70" height="24" rx="12" fill="#f0f0f0" stroke="#333333" stroke-width="1"/>
    <text x="220" y="51" font-size="10" text-anchor="middle" fill="#111111">📚 Books</text>

    <rect x="15" y="65" width="115" height="22" rx="4" fill="#ffffff" stroke="#999999" stroke-width="1"/>
    <text x="22" y="79" font-size="10" fill="#888888">Amount (RM): 25</text>

    <rect x="140" y="65" width="115" height="22" rx="4" fill="#ffffff" stroke="#999999" stroke-width="1"/>
    <text x="147" y="79" font-size="10" fill="#888888">Note: Lunch</text>
  </g>

  <!-- Add Button & Clear Button -->
  <g transform="translate(25, 480)">
    <rect x="0" y="0" width="130" height="42" rx="6" fill="#111111" stroke="#111111" stroke-width="1.5"/>
    <text x="65" y="26" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">+ Add Button</text>

    <rect x="140" y="0" width="130" height="42" rx="6" fill="#f4f4f4" stroke="#333333" stroke-width="1.5"/>
    <text x="205" y="26" font-size="12" font-weight="bold" text-anchor="middle" fill="#111111">Clear Button</text>
  </g>

  <!-- Navigation Bar -->
  <g transform="translate(5, 550)">
    <rect x="0" y="0" width="310" height="55" rx="0" fill="#ffffff" stroke="#2b2b2b" stroke-width="2"/>
    <text x="38" y="28" font-size="10" text-anchor="middle" fill="#777777">Gauge</text>
    <text x="100" y="28" font-size="10" font-weight="bold" text-anchor="middle" fill="#111111">[Tracker]</text>
    <text x="165" y="28" font-size="10" text-anchor="middle" fill="#777777">BNPL</text>
    <text x="230" y="28" font-size="10" text-anchor="middle" fill="#777777">Events</text>
    <text x="285" y="28" font-size="9" text-anchor="middle" fill="#777777">Widget</text>
  </g>
</svg>
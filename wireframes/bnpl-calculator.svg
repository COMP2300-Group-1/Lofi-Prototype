<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 620" width="320" height="620" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">
  <!-- Device Frame -->
  <rect x="5" y="5" width="310" height="610" rx="30" fill="#ffffff" stroke="#2b2b2b" stroke-width="3"/>
  <rect x="110" y="12" width="100" height="16" rx="8" fill="#e0e0e0"/>

  <!-- Screen Header -->
  <text x="160" y="52" font-size="15" font-weight="bold" text-anchor="middle" fill="#111111">BNPL/Spending Calculator</text>
  <line x1="20" y1="65" x2="300" y2="65" stroke="#cccccc" stroke-width="1"/>

  <!-- Top Allowance Breakdown -->
  <g transform="translate(25, 75)">
    <!-- Monthly Allowance Card -->
    <rect x="0" y="0" width="125" height="75" rx="6" fill="#f8f9fa" stroke="#333333" stroke-width="1.5"/>
    <text x="62" y="20" font-size="9" text-anchor="middle" fill="#555555">Monthly allowance</text>
    <text x="62" y="32" font-size="8" text-anchor="middle" fill="#777777">before &amp; after</text>
    <text x="62" y="50" font-size="12" font-weight="bold" text-anchor="middle" fill="#111111">RM 1,500</text>
    <text x="62" y="65" font-size="10" text-anchor="middle" fill="#666666">Net: RM 530</text>

    <!-- Basic Necessities Deduction -->
    <rect x="0" y="85" width="125" height="55" rx="6" fill="#f8f9fa" stroke="#333333" stroke-width="1.5"/>
    <text x="62" y="105" font-size="9" text-anchor="middle" fill="#555555">Basic necessities</text>
    <text x="62" y="117" font-size="8" text-anchor="middle" fill="#777777">deduction (rent/food)</text>
    <text x="62" y="132" font-size="12" font-weight="bold" text-anchor="middle" fill="#111111">- RM 800</text>

    <!-- List of Current Installments / Planned Spendings -->
    <rect x="135" y="0" width="135" height="140" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
    <text x="202" y="20" font-size="9" font-weight="bold" text-anchor="middle" fill="#111111">Current Installments</text>
    <line x1="145" y1="28" x2="260" y2="28" stroke="#e0e0e0" stroke-width="1"/>
    
    <text x="145" y="44" font-size="9" font-weight="600" fill="#222222">SPayLater (Laptop)</text>
    <text x="145" y="56" font-size="8" fill="#666666">RM 120/mo (3 of 6)</text>

    <text x="145" y="74" font-size="9" font-weight="600" fill="#222222">Atome (Shoes)</text>
    <text x="145" y="86" font-size="8" fill="#666666">RM 50/mo (2 of 3)</text>

    <line x1="145" y1="96" x2="260" y2="96" stroke="#e0e0e0" stroke-width="1"/>
    <text x="145" y="112" font-size="9" font-weight="bold" fill="#111111">Total BNPL Due:</text>
    <text x="145" y="126" font-size="11" font-weight="bold" fill="#333333">RM 170 / month</text>
  </g>

  <!-- Interactive BNPL / Spending Calculator Section -->
  <g transform="translate(25, 235)">
    <rect x="0" y="0" width="270" height="285" rx="6" fill="#ffffff" stroke="#333333" stroke-width="2"/>
    <text x="135" y="26" font-size="13" font-weight="bold" text-anchor="middle" fill="#111111">BNPL/Spending Calculator</text>
    <text x="135" y="42" font-size="10" text-anchor="middle" fill="#666666">(Interchangeable Mode)</text>
    <line x1="20" y1="52" x2="250" y2="52" stroke="#e0e0e0" stroke-width="1"/>

    <!-- Form Inputs Mock -->
    <text x="20" y="72" font-size="10" font-weight="600" fill="#333333">New Purchase Price (RM):</text>
    <rect x="20" y="80" width="230" height="30" rx="4" fill="#fcfcfc" stroke="#999999" stroke-width="1"/>
    <text x="30" y="100" font-size="12" fill="#111111">RM 360.00</text>

    <text x="20" y="128" font-size="10" font-weight="600" fill="#333333">Tenure / Plan Duration:</text>
    <!-- Radio chips -->
    <rect x="20" y="136" width="65" height="26" rx="4" fill="#333333"/>
    <text x="52" y="153" font-size="10" font-weight="bold" text-anchor="middle" fill="#ffffff">3 Months</text>

    <rect x="95" y="136" width="65" height="26" rx="4" fill="#f0f0f0" stroke="#cccccc" stroke-width="1"/>
    <text x="127" y="153" font-size="10" text-anchor="middle" fill="#111111">6 Months</text>

    <rect x="170" y="136" width="80" height="26" rx="4" fill="#f0f0f0" stroke="#cccccc" stroke-width="1"/>
    <text x="210" y="153" font-size="10" text-anchor="middle" fill="#111111">Full Payment</text>

    <!-- Calculation Impact Output Box -->
    <rect x="20" y="176" width="230" height="85" rx="6" fill="#f4f5f7" stroke="#333333" stroke-width="1.5" stroke-dasharray="3 2"/>
    <text x="30" y="196" font-size="10" fill="#555555">New Monthly Installment:</text>
    <text x="240" y="196" font-size="11" font-weight="bold" text-anchor="end" fill="#111111">+ RM 120 / mo</text>

    <text x="30" y="218" font-size="10" fill="#555555">Revised Safe Daily Allowance:</text>
    <text x="240" y="218" font-size="11" font-weight="bold" text-anchor="end" fill="#111111">RM 13.66 / day</text>

    <text x="30" y="242" font-size="10" font-weight="bold" fill="#333333">⚠️ Impact: Reduces daily food budget by 23%</text>
  </g>

  <!-- Navigation Bar -->
  <g transform="translate(5, 550)">
    <rect x="0" y="0" width="310" height="55" rx="0" fill="#ffffff" stroke="#2b2b2b" stroke-width="2"/>
    <text x="38" y="28" font-size="10" text-anchor="middle" fill="#777777">Gauge</text>
    <text x="100" y="28" font-size="10" text-anchor="middle" fill="#777777">Tracker</text>
    <text x="165" y="28" font-size="10" font-weight="bold" text-anchor="middle" fill="#111111">[BNPL]</text>
    <text x="230" y="28" font-size="10" text-anchor="middle" fill="#777777">Events</text>
    <text x="285" y="28" font-size="9" text-anchor="middle" fill="#777777">Widget</text>
  </g>
</svg>
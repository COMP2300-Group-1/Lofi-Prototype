<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 620" width="320" height="620" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">
  <!-- Device Frame -->
  <rect x="5" y="5" width="310" height="610" rx="30" fill="#ffffff" stroke="#2b2b2b" stroke-width="3"/>
  <rect x="110" y="12" width="100" height="16" rx="8" fill="#e0e0e0"/>

  <!-- Screen Header -->
  <text x="160" y="52" font-size="16" font-weight="bold" text-anchor="middle" fill="#111111">Event Planner</text>
  <line x1="20" y1="65" x2="300" y2="65" stroke="#cccccc" stroke-width="1"/>

  <!-- Top Row: Money Left & Groups -->
  <g transform="translate(25, 75)">
    <!-- Money Left Box -->
    <rect x="0" y="0" width="130" height="55" rx="6" fill="#f4f4f4" stroke="#333333" stroke-width="1.5"/>
    <text x="65" y="22" font-size="11" text-anchor="middle" fill="#666666">Money Left</text>
    <text x="65" y="42" font-size="14" font-weight="bold" text-anchor="middle" fill="#111111">RM 280.00</text>

    <!-- Groups Box -->
    <rect x="145" y="0" width="125" height="110" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
    <text x="207" y="22" font-size="11" font-weight="bold" text-anchor="middle" fill="#111111">Groups</text>
    <line x1="155" y1="28" x2="260" y2="28" stroke="#e0e0e0" stroke-width="1"/>
    
    <rect x="153" y="36" width="108" height="20" rx="4" fill="#f0f0f0"/>
    <text x="207" y="50" font-size="9" text-anchor="middle" fill="#111111">👥 Roommates (4)</text>

    <rect x="153" y="60" width="108" height="20" rx="4" fill="#f0f0f0"/>
    <text x="207" y="74" font-size="9" text-anchor="middle" fill="#111111">🎓 Study Group (6)</text>

    <rect x="153" y="84" width="108" height="20" rx="4" fill="#f0f0f0"/>
    <text x="207" y="98" font-size="9" text-anchor="middle" fill="#111111">🏸 Badminton (8)</text>

    <!-- Agreed Events Box -->
    <rect x="0" y="65" width="130" height="50" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
    <text x="65" y="86" font-size="11" font-weight="bold" text-anchor="middle" fill="#111111">Agreed events</text>
    <text x="65" y="103" font-size="10" text-anchor="middle" fill="#555555">2 Outings Confirmed</text>
  </g>

  <!-- Events Master Card -->
  <g transform="translate(25, 205)">
    <rect x="0" y="0" width="270" height="315" rx="6" fill="#ffffff" stroke="#333333" stroke-width="2"/>
    <text x="135" y="28" font-size="14" font-weight="bold" text-anchor="middle" fill="#111111">Events</text>
    <line x1="20" y1="40" x2="250" y2="40" stroke="#e0e0e0" stroke-width="1"/>

    <!-- Event Item 1 -->
    <rect x="15" y="50" width="240" height="70" rx="6" fill="#f8f9fa" stroke="#cccccc" stroke-width="1"/>
    <text x="25" y="72" font-size="11" font-weight="bold" fill="#111111">Steamboat Dinner @ Sutera Mall</text>
    <text x="25" y="89" font-size="9" fill="#666666">📅 Sat, 22 Nov • Group: Roommates</text>
    <text x="25" y="106" font-size="9" font-weight="600" fill="#333333">Total: RM 160  |  Your Share: RM 40.00</text>
    <rect x="180" y="85" width="65" height="22" rx="4" fill="#111111"/>
    <text x="212" y="100" font-size="9" font-weight="bold" text-anchor="middle" fill="#ffffff">Agreed ✓</text>

    <!-- Event Item 2 -->
    <rect x="15" y="130" width="240" height="70" rx="6" fill="#f8f9fa" stroke="#cccccc" stroke-width="1"/>
    <text x="25" y="152" font-size="11" font-weight="bold" fill="#111111">Weekend Roadtrip to Desaru</text>
    <text x="25" y="169" font-size="9" fill="#666666">📅 Next Sun • Group: Study Group</text>
    <text x="25" y="186" font-size="9" font-weight="600" fill="#333333">Est. Share: RM 85.00  |  Budget Check: OK</text>
    <rect x="180" y="165" width="65" height="22" rx="4" fill="#e0e0e0" stroke="#333333" stroke-width="1"/>
    <text x="212" y="180" font-size="9" font-weight="bold" text-anchor="middle" fill="#111111">Pending</text>

    <!-- Interactive Event Cost Splitter Card -->
    <rect x="15" y="210" width="240" height="90" rx="6" fill="#f4f4f4" stroke="#333333" stroke-width="1.5" stroke-dasharray="3 2"/>
    <text x="25" y="230" font-size="10" font-weight="bold" fill="#111111">➕ Plan New Event / Cost Splitter</text>
    <text x="25" y="248" font-size="9" fill="#555555">Estimated Total: RM 120   Pax: 4 friends</text>
    <text x="25" y="266" font-size="10" font-weight="bold" fill="#111111">Calculated Share: RM 30.00 / person</text>
    <text x="25" y="284" font-size="9" fill="#666666">Buffer Status: Within your RM 280 safe margin</text>
  </g>

  <!-- Navigation Bar -->
  <g transform="translate(5, 550)">
    <rect x="0" y="0" width="310" height="55" rx="0" fill="#ffffff" stroke="#2b2b2b" stroke-width="2"/>
    <text x="38" y="28" font-size="10" text-anchor="middle" fill="#777777">Gauge</text>
    <text x="100" y="28" font-size="10" text-anchor="middle" fill="#777777">Tracker</text>
    <text x="165" y="28" font-size="10" text-anchor="middle" fill="#777777">BNPL</text>
    <text x="230" y="28" font-size="10" font-weight="bold" text-anchor="middle" fill="#111111">[Events]</text>
    <text x="285" y="28" font-size="9" text-anchor="middle" fill="#777777">Widget</text>
  </g>
</svg>